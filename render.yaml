services:
  - type: web
    name: quick-rider-gh-api
    runtime: node
    plan: free
    buildCommand: |
      npm install -g pnpm
      pnpm install --frozen-lockfile
      pnpm --filter backend exec prisma generate
      pnpm --filter backend build
    startCommand: node packages/backend/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false          # paste your Neon / Supabase URL in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: FRONTEND_URL
        value: https://YOUR-SITE.netlify.app   # update after Netlify deploy
      - key: GHANAPOST_ENABLED
        value: "true"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
