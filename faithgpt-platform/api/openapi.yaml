        "200":
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        "403":
          $ref: '#/components/responses/Forbidden'

  /admin/organizations/{id}:
    patch:
      tags: [Admin]
      summary: Update an organization's seats/billing (ADMIN, SUPER_ADMIN)
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                seatLimit: { type: integer }
                billingEmail: { type: string, format: email, nullable: true }
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Organization'

  /admin/ai-usage:
    get:
      tags: [Admin]
      summary: Aggregate AI usage analytics (ADMIN, SUPER_ADMIN)
      parameters:
        - name: feature
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AIFeature'
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Aggregated usage + cost
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AIUsageSummary'

  /admin/moderation/images:
    get:
      tags: [Admin]
      summary: List flagged image generations (MODERATOR, ADMIN, SUPER_ADMIN)
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        "200":
          description: Flagged images
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ImageGeneration'
                  meta:
                    $ref: '#/components/schemas/OffsetPaginationMeta'

  /admin/moderation/posts/{id}:
    patch:
      tags: [Admin]
      summary: Resolve a flagged community post (MODERATOR, ADMIN, SUPER_ADMIN)
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [moderationStatus]
              properties:
                moderationStatus:
                  $ref: '#/components/schemas/ModerationStatus'
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CommunityPost'

# =====================================================================================
# COMPONENTS
# =====================================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Opaque cuid()
    CursorParam:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    LimitParam:
      name: limit
      in: query
      required: false
      schema: { type: integer, default: 20, maximum: 100 }
    PageParam:
      name: page
      in: query
      required: false
      schema: { type: integer, default: 1 }
    PageSizeParam:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, default: 20, maximum: 100 }

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing/invalid credentials or token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated but not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Resource conflict (e.g., unique constraint)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    QuotaExceeded:
      description: Tier-based AI usage quota exceeded (429 RATE_LIMITED, code=QUOTA_EXCEEDED in details)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TierRequired:
      description: Capability requires a higher subscription tier (403, code=TIER_REQUIRED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    # --- Envelopes ---------------------------------------------------------
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: "VALIDATION_ERROR" }
            message: { type: string }
            details:
              type: object
              nullable: true
              additionalProperties: true

    CursorPaginationMeta:
      type: object
      properties:
        pagination:
          type: object
          properties:
            nextCursor: { type: string, nullable: true }
            hasMore: { type: boolean }

    OffsetPaginationMeta:
      type: object
      properties:
        pagination:
          type: object
          properties:
            page: { type: integer }
            pageSize: { type: integer }
            total: { type: integer }
            totalPages: { type: integer }

    AuthTokenResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            accessToken: { type: string }
            refreshToken: { type: string }
            user:
              $ref: '#/components/schemas/User'

    EnvelopeUser:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/User'

    EnvelopeOrganization:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Organization'

    # --- Enums (mirror schema.prisma verbatim, §00 §13) ---------------------
    UserRole:
      type: string
      enum: [USER, GROUP_LEADER, MINISTRY_ADMIN, MODERATOR, CONTENT_EDITOR, SUPPORT, ADMIN, SUPER_ADMIN]

    SubscriptionTier:
      type: string
      enum: [FREE, PLUS, PREMIUM, MINISTRY, LIFETIME]

    SubscriptionStatus:
      type: string
      enum: [ACTIVE, TRIALING, PAST_DUE, CANCELED, EXPIRED, PAUSED]

    BillingProvider:
      type: string
      enum: [STRIPE, APPLE_IAP, GOOGLE_PLAY, PAYSTACK, MANUAL]

    AuthProviderType:
      type: string
      enum: [PASSWORD, GOOGLE, APPLE, FACEBOOK, PHONE_OTP]

    Testament:
      type: string
      enum: [OLD, NEW]

    DevotionType:
      type: string
      enum: [PERSONAL, FAMILY, YOUTH, CHILDREN, PATHFINDER, WOMEN, MEN, LEADERSHIP, MARRIAGE, EVANGELISTIC, SABBATH_SCHOOL, SMALL_GROUP, SERMON_PREP]

    DevotionDepth:
      type: string
      enum: [QUICK, STANDARD, DEEP, ADVANCED, TEACHING, SERMON]

    BiblicalElementType:
      type: string
      enum: [COMMAND, PROMISE, WARNING, BLESSING, PROPHECY, FULFILLMENT, CHARACTER_LESSON, LIFE_APPLICATION, SPIRITUAL_PRINCIPLE]

    PrayerType:
      type: string
      enum: [PERSONAL, FAMILY, HEALING, INTERCESSORY, GRATITUDE, LEADERSHIP, MARRIAGE, GUIDANCE, STRENGTH]

    AIQuestionCategory:
      type: string
      enum: [MEANING, SIMPLE_EXPLANATION, CHILDRENS_EXPLANATION, HISTORICAL_BACKGROUND, CULTURAL_CONTEXT, MODERN_APPLICATION, HEBREW_ORIGINAL, GREEK_ORIGINAL, CROSS_REFERENCES, CHARACTER_PARALLELS, CHRIST_CONNECTION, GENERAL]

    MessageRole:
      type: string
      enum: [USER, ASSISTANT, SYSTEM]

    ImageStyle:
      type: string
      enum: [PHOTOREALISTIC, CINEMATIC, CHRISTIAN_ARTWORK, CARTOON, CHILDRENS_STORYBOOK, COMIC_BOOK, WATERCOLOR, OIL_PAINTING, MINIMALIST_POSTER, SOCIAL_MEDIA_GRAPHIC]

    ImageSourceType:
      type: string
      enum: [VERSE, CHAPTER, BIBLE_STORY, DEVOTION, PRAYER, SERMON, MEMORY_VERSE, CUSTOM_PROMPT]

    GenerationStatus:
      type: string
      enum: [PENDING, PROCESSING, COMPLETED, FAILED, MODERATION_BLOCKED]

    MemoryCardFormat:
      type: string
      enum: [FLASHCARD, WALLPAPER, LOCK_SCREEN, CHILDRENS_CARD, PRINTABLE]

    JournalEntryType:
      type: string
      enum: [NOTE, DEVOTION, PRAYER, TESTIMONY, INSIGHT, ANSWERED_PRAYER]

    PrayerRequestVisibility:
      type: string
      enum: [PRIVATE, GROUP, PUBLIC]

    StreakType:
      type: string
      enum: [READING, PRAYER, DEVOTION]

    GroupRole:
      type: string
      enum: [MEMBER, LEADER]

    CommunityPostType:
      type: string
      enum: [DEVOTION_SHARE, TESTIMONY, PRAYER_REQUEST, INSIGHT, IMAGE_SHARE]

    ModerationStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, FLAGGED]

    NotificationType:
      type: string
      enum: [DAILY_DEVOTION, STREAK_REMINDER, PRAYER_ANSWERED, GROUP_ACTIVITY, COMMUNITY_INTERACTION, SUBSCRIPTION, SYSTEM]

    AIFeature:
      type: string
      enum: [DEVOTION, BIBLE_STUDY, PRAYER, SERMON, SCRIPTURE_ANALYSIS, IMAGE_GENERATION, STORY_VISUALIZER, CONTENT_CREATOR]

    # --- Core models ---------------------------------------------------------
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        name: { type: string }
        avatarUrl: { type: string, nullable: true }
        role:
          $ref: '#/components/schemas/UserRole'
        tier:
          $ref: '#/components/schemas/SubscriptionTier'
        denominationLens: { type: string, nullable: true, example: "NEUTRAL" }
        locale: { type: string, example: "en" }
        timezone: { type: string, example: "UTC" }
        defaultBibleVersionId: { type: string, nullable: true }
        emailVerifiedAt: { type: boolean }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }

    RefreshTokenSummary:
      type: object
      properties:
        id: { type: string }
        deviceInfo: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        isCurrent: { type: boolean }

    Organization:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, example: "CHURCH" }
        seatLimit: { type: integer }
        billingEmail: { type: string, format: email, nullable: true }
        createdAt: { type: string, format: date-time }

    OrganizationMember:
      type: object
      properties:
        id: { type: string }
        organizationId: { type: string }
        userId: { type: string }
        roleInOrg: { type: string, enum: [ADMIN, STAFF] }
        joinedAt: { type: string, format: date-time }
        user:
          $ref: '#/components/schemas/User'

    Subscription:
      type: object
      properties:
        id: { type: string }
        userId: { type: string, nullable: true }
        organizationId: { type: string, nullable: true }
        tier:
          $ref: '#/components/schemas/SubscriptionTier'
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        provider:
          $ref: '#/components/schemas/BillingProvider'
        seats: { type: integer }
        currentPeriodStart: { type: string, format: date-time, nullable: true }
        currentPeriodEnd: { type: string, format: date-time, nullable: true }
        cancelAtPeriodEnd: { type: boolean }
        trialEndsAt: { type: string, format: date-time, nullable: true }

    Entitlements:
      type: object
      description: Resolved {tier, quotas, usageRemaining} per §11 §7 EntitlementService
      properties:
        tier:
          $ref: '#/components/schemas/SubscriptionTier'
        quotas:
          type: object
          additionalProperties: true
          example:
            aiStudyQuestionsPerDay: 50
            devotionDeepPerMonth: -1
            imagesPerMonth: 50
        usageRemaining:
          type: object
          additionalProperties: true
          example:
            aiStudyQuestionsPerDay: 37
            imagesPerMonth: 12

    Invoice:
      type: object
      properties:
        id: { type: string }
        subscriptionId: { type: string }
        amountCents: { type: integer }
        currency: { type: string, example: "USD" }
        status: { type: string, enum: [paid, open, void, uncollectible] }
        providerInvoiceId: { type: string, nullable: true }
        issuedAt: { type: string, format: date-time }

    # --- Bible ---------------------------------------------------------------
    BibleVersion:
      type: object
      properties:
        id: { type: string }
        code: { type: string, example: "ESV" }
        name: { type: string, example: "English Standard Version" }
        language: { type: string, example: "en" }
        license: { type: string, enum: [PUBLIC_DOMAIN, LICENSED] }
        isOfflineBundled: { type: boolean }
        publisher: { type: string, nullable: true }

    BibleBook:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: "Romans" }
        abbreviation: { type: string, example: "Rom" }
        testament:
          $ref: '#/components/schemas/Testament'
        orderIndex: { type: integer, example: 45 }
        chapterCount: { type: integer, example: 16 }

    VerseWithText:
      type: object
      properties:
        id: { type: string }
        bookId: { type: string }
        chapter: { type: integer }
        verse: { type: integer }
        reference: { type: string, example: "Romans 8:28" }
        text: { type: string, example: "And we know that for those who love God all things work together for good..." }
        versionCode: { type: string, example: "ESV" }

    Highlight:
      type: object
      properties:
        id: { type: string }
        verseId: { type: string }
        color: { type: string, example: "yellow" }
        createdAt: { type: string, format: date-time }

    Note:
      type: object
      properties:
        id: { type: string }
        verseId: { type: string }
        content: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Bookmark:
      type: object
      properties:
        id: { type: string }
        verseId: { type: string }
        createdAt: { type: string, format: date-time }

    # --- Reading Plans ---------------------------------------------------------
    ReadingPlan:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        durationDays: { type: integer }
        category: { type: string, example: "New Testament in 30 Days" }
        isPremium: { type: boolean }

    ReadingPlanDetail:
      allOf:
        - $ref: '#/components/schemas/ReadingPlan'
        - type: object
          properties:
            days:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  dayNumber: { type: integer }
                  title: { type: string, nullable: true }
                  devotionalNote: { type: string, nullable: true }
                  passages:
                    type: array
                    items:
                      type: object
                      properties:
                        bookId: { type: string }
                        chapterStart: { type: integer }
                        verseStart: { type: integer, nullable: true }
                        chapterEnd: { type: integer }
                        verseEnd: { type: integer, nullable: true }

    UserReadingPlan:
      type: object
      properties:
        id: { type: string }
        planId: { type: string }
        startedAt: { type: string, format: date-time }
        currentDay: { type: integer }
        completedAt: { type: string, format: date-time, nullable: true }
        plan:
          $ref: '#/components/schemas/ReadingPlan'

    # --- Scripture Analysis ---------------------------------------------------------
    ScriptureAnalysisResult:
      type: object
      properties:
        passageKey: { type: string, example: "ROM.8.28-39" }
        versionCode: { type: string, example: "ESV" }
        themes:
          type: array
          items:
            type: object
            properties:
              slug: { type: string, example: "hope" }
              name: { type: string, example: "Hope" }
              relevance: { type: number, format: float, example: 0.92 }
        elements:
          type: array
          items:
            type: object
            properties:
              type:
                $ref: '#/components/schemas/BiblicalElementType'
              note: { type: string, nullable: true }
        suggestedThemes:
          type: array
          items: { type: string }
          example: ["God's Sovereign Love", "Suffering and Glory", "Nothing Can Separate Us"]

    # --- Devotions (AI Verse-to-Devotion Engine™) ---------------------------------------------------------
    DevotionSections:
      type: object
      description: Canonical 15-section structured output, §00 §8
      properties:
        title: { type: string }
        keyScripture: { type: string }
        historicalContext: { type: string }
        biblicalContext: { type: string }
        verseExplanation: { type: string }
        theologicalInsights: { type: string }
        spiritualLessons: { type: string }
        lifeApplications: { type: string }
        reflectionQuestions:
          type: array
          items: { type: string }
        discussionQuestions:
          type: array
          items: { type: string }
        prayer: { type: string }
        actionSteps:
          type: array
          items: { type: string }
        memoryVerse: { type: string }
        relatedScriptures:
          type: array
          items: { type: string }
        closingEncouragement: { type: string }

    Devotion:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        passageKey: { type: string, example: "ROM.8.28-39" }
        versionCode: { type: string, example: "ESV" }
        type:
          $ref: '#/components/schemas/DevotionType'
        depth:
          $ref: '#/components/schemas/DevotionDepth'
        sections:
          $ref: '#/components/schemas/DevotionSections'
        memoryVerseRef: { type: string, nullable: true }
        isFavorite: { type: boolean }
        isShared: { type: boolean }
        createdAt: { type: string, format: date-time }

    GenerateDevotionRequest:
      type: object
      required: [passageKey, type, depth]
      properties:
        passageKey: { type: string, example: "ROM.8.28-39" }
        versionCode: { type: string, default: "ESV" }
        type:
          $ref: '#/components/schemas/DevotionType'
        depth:
          $ref: '#/components/schemas/DevotionDepth'
        themes:
          type: array
          items: { type: string }
          description: Theme slugs selected during Theme Discovery (§02 §1.3)

    # --- AI Bible Study Assistant™ ---------------------------------------------------------
    AIConversation:
      type: object
      properties:
        id: { type: string }
        title: { type: string, nullable: true }
        contextPassageKey: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AIConversationDetail:
      allOf:
        - $ref: '#/components/schemas/AIConversation'
        - type: object
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/AIMessage'

    AIMessage:
      type: object
      properties:
        id: { type: string }
        conversationId: { type: string }
        role:
          $ref: '#/components/schemas/MessageRole'
        category:
          allOf:
            - $ref: '#/components/schemas/AIQuestionCategory'
          nullable: true
        content: { type: string }
        citations:
          type: array
          nullable: true
          items:
            type: object
            properties:
              ref: { type: string, example: "John 3:16" }
              versionCode: { type: string, example: "ESV" }
        createdAt: { type: string, format: date-time }

    # --- Prayer ---------------------------------------------------------
    Prayer:
      type: object
      properties:
        id: { type: string }
        type:
          $ref: '#/components/schemas/PrayerType'
        passageKey: { type: string, nullable: true }
        content: { type: string }
        isFavorite: { type: boolean }
        createdAt: { type: string, format: date-time }

    # --- Sermon ---------------------------------------------------------
    Sermon:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        passageKey: { type: string }
        audience: { type: string, nullable: true }
        outline:
          type: object
          description: "{title, introduction, mainPoints[], illustrations[], application, altarCall, ...}"
          additionalProperties: true
        createdAt: { type: string, format: date-time }

    # --- Visual Studio ---------------------------------------------------------
    GenerateImageRequest:
      type: object
      required: [sourceType, style]
      properties:
        sourceType:
          $ref: '#/components/schemas/ImageSourceType'
        sourceKey: { type: string, nullable: true, description: "passageKey, storyKey, etc. (required unless sourceType=CUSTOM_PROMPT)" }
        devotionId: { type: string, nullable: true }
        prayerId: { type: string, nullable: true }
        sermonId: { type: string, nullable: true }
        style:
          $ref: '#/components/schemas/ImageStyle'
        userPrompt: { type: string, nullable: true }

    ImageGeneration:
      type: object
      properties:
        id: { type: string }
        sourceType:
          $ref: '#/components/schemas/ImageSourceType'
        sourceKey: { type: string }
        style:
          $ref: '#/components/schemas/ImageStyle'
        refinedPrompt: { type: string }
        status:
          $ref: '#/components/schemas/GenerationStatus'
        resultUrl: { type: string, nullable: true }
        thumbnailUrl: { type: string, nullable: true }
        isWatermarked: { type: boolean }
        moderationStatus:
          $ref: '#/components/schemas/ModerationStatus'
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    BibleStoryVisualization:
      type: object
      properties:
        id: { type: string }
        storyKey: { type: string, example: "david-and-goliath" }
        style:
          $ref: '#/components/schemas/ImageStyle'
        outputType: { type: string, enum: [STORYBOARD, COMIC, STORYBOOK, TEACHING_SLIDES] }
        createdAt: { type: string, format: date-time }

    BibleStoryVisualizationDetail:
      allOf:
        - $ref: '#/components/schemas/BibleStoryVisualization'
        - type: object
          properties:
            frames:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  sequence: { type: integer }
                  caption: { type: string }
                  imageGeneration:
                    $ref: '#/components/schemas/ImageGeneration'

    MemoryVerseCard:
      type: object
      properties:
        id: { type: string }
        verseId: { type: string }
        format:
          $ref: '#/components/schemas/MemoryCardFormat'
        imageGeneration:
          $ref: '#/components/schemas/ImageGeneration'
        createdAt: { type: string, format: date-time }

    # --- Journal ---------------------------------------------------------
    JournalEntry:
      type: object
      properties:
        id: { type: string }
        type:
          $ref: '#/components/schemas/JournalEntryType'
        title: { type: string, nullable: true }
        content: { type: string }
        tags:
          type: array
          items: { type: string }
        relatedDevotionId: { type: string, nullable: true }
        relatedPrayerId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PrayerRequest:
      type: object
      properties:
        id: { type: string }
        content: { type: string }
        isAnonymous: { type: boolean }
        isAnswered: { type: boolean }
        answeredNote: { type: string, nullable: true }
        answeredAt: { type: string, format: date-time, nullable: true }
        visibility:
          $ref: '#/components/schemas/PrayerRequestVisibility'
        groupId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    # --- Growth ---------------------------------------------------------
    GrowthDashboard:
      type: object
      properties:
        streaks:
          type: array
          items:
            type: object
            properties:
              type:
                $ref: '#/components/schemas/StreakType'
              currentStreak: { type: integer }
              longestStreak: { type: integer }
              lastActivityDate: { type: string, format: date }
        stats:
          type: object
          properties:
            chaptersRead: { type: integer }
            booksCompleted: { type: integer }
            devotionsGenerated: { type: integer }
            memoryVersesSaved: { type: integer }
            studyMinutes: { type: integer }
            prayersGenerated: { type: integer }
        recentAchievements:
          type: array
          items:
            $ref: '#/components/schemas/AchievementWithProgress'

    AchievementWithProgress:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        iconUrl: { type: string, nullable: true }
        unlockedAt: { type: string, format: date-time, nullable: true }
        progress:
          type: object
          nullable: true
          properties:
            current: { type: integer }
            target: { type: integer }

    # --- Community ---------------------------------------------------------
    CommunityPost:
      type: object
      properties:
        id: { type: string }
        type:
          $ref: '#/components/schemas/CommunityPostType'
        content: { type: string }
        moderationStatus:
          $ref: '#/components/schemas/ModerationStatus'
        likeCount: { type: integer }
        commentCount: { type: integer }
        author:
          $ref: '#/components/schemas/User'
        createdAt: { type: string, format: date-time }

    PostComment:
      type: object
      properties:
        id: { type: string }
        postId: { type: string }
        content: { type: string }
        author:
          $ref: '#/components/schemas/User'
        createdAt: { type: string, format: date-time }

    # --- Groups ---------------------------------------------------------
    Group:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        memberCount: { type: integer }
        createdAt: { type: string, format: date-time }

    GroupMembership:
      type: object
      properties:
        id: { type: string }
        groupId: { type: string }
        userId: { type: string }
        role:
          $ref: '#/components/schemas/GroupRole'
        joinedAt: { type: string, format: date-time }

    # --- Notifications ---------------------------------------------------------
    Notification:
      type: object
      properties:
        id: { type: string }
        type:
          $ref: '#/components/schemas/NotificationType'
        title: { type: string }
        body: { type: string }
        deepLink: { type: string, nullable: true, example: "faithgpt://devotion/clx1devotion0001" }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    # --- Admin ---------------------------------------------------------
    AIUsageSummary:
      type: object
      properties:
        totalRequests: { type: integer }
        totalCostUsdMicros: { type: integer }
        byFeature:
          type: array
          items:
            type: object
            properties:
              feature:
                $ref: '#/components/schemas/AIFeature'
              requests: { type: integer }
              costUsdMicros: { type: integer }
              avgLatencyMs: { type: integer }
              errorRate: { type: number, format: float }
