  /ai-conversations/{id}/messages:
    post:
      tags: [AI Study]
      summary: Ask a question in a conversation (streamable assistant reply)
      description: >
        Same SSE/JSON dual-mode contract as `/devotions/generate` (§09 §6). The assistant message
        is streamed token-by-token under `event: section` with `section: "answer"`, then
        `event: done` carries the persisted AIMessage id.
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, example: "What does it mean that 'all things work together for good'?" }
                category:
                  $ref: '#/components/schemas/AIQuestionCategory'
      responses:
        "201":
          description: Assistant reply (non-streamed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AIMessage'
            text/event-stream:
              schema:
                type: string
                description: See §09 §6
        "429":
          $ref: '#/components/responses/QuotaExceeded'
        "451":
          description: Blocked by content-safety policy (crisis-resource intercept, §12 §3)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

