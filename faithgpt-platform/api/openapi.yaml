openapi: 3.0.3
info:
  title: FaithGPT API
  version: "1.0.0"
  description: >
    Canonical REST API contract for FaithGPT™ ("Transforming Scripture into Daily Living").
    Conventions, envelopes, pagination, streaming, and rate-limiting are documented narratively
    in /faithgpt-platform/docs/09-api-architecture.md — this document is the reviewable
    machine-readable snapshot. Schema names mirror /faithgpt-platform/schema/schema.prisma
    verbatim (see /faithgpt-platform/docs/00-shared-reference.md §13).
  contact:
    name: FaithGPT Engineering
    url: https://faithgpt.app

servers:
  - url: https://api.faithgpt.app/api/v1
    description: Production
  - url: https://staging-api.faithgpt.app/api/v1
    description: Staging
  - url: http://localhost:3000/api/v1
    description: Local development

tags:
  - name: Auth
  - name: Users
  - name: Organizations
  - name: Subscriptions
  - name: Bible
  - name: Bible Interactions
  - name: Reading Plans
  - name: Scripture Analysis
  - name: Devotions
  - name: AI Study
  - name: Prayers
  - name: Sermons
  - name: Visual Studio
  - name: Journal
  - name: Growth
  - name: Community
  - name: Groups
  - name: Notifications
  - name: Admin

security:
  - bearerAuth: []

# =====================================================================================
# PATHS
# =====================================================================================
paths:

  # ---------------------------------------------------------------------------------
  # AUTH
  # ---------------------------------------------------------------------------------
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user (email/password)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 10 }
                name: { type: string }
                denominationLens: { type: string, nullable: true, example: "NEUTRAL" }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        "409":
          $ref: '#/components/responses/Conflict'
        "400":
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with email/password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                deviceInfo: { type: string, nullable: true }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new access/refresh token pair (rotation)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: New token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a refresh token (log out this device)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "204":
          description: Logged out

  /auth/oauth/{provider}/callback:
    post:
      tags: [Auth]
      summary: Exchange a Google/Apple/Facebook identity token for a FaithGPT session
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, apple, facebook]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken: { type: string }
                deviceInfo: { type: string, nullable: true }
      responses:
        "200":
          description: Authenticated (existing account linked or new account created)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /auth/verify-phone:
    post:
      tags: [Auth]
      summary: Verify a phone number via Twilio Verify OTP, or sign in/up with PHONE_OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string, example: "+233201234567" }
                code: { type: string, example: "123456" }
                deviceInfo: { type: string, nullable: true }
      responses:
        "200":
          description: Verified / authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /auth/verify-email:
    get:
      tags: [Auth]
      summary: Verify email via single-use token (24h expiry)
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Email verified
        "401":
          $ref: '#/components/responses/Unauthorized'

  /auth/password-reset/request:
    post:
      tags: [Auth]
      summary: Request a password reset email (always returns 202)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202":
          description: Accepted (no account-existence leakage)

  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      summary: Confirm a password reset, revoking all existing refresh tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 10 }
      responses:
        "200":
          description: Password updated, all sessions revoked
        "401":
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------------------
  # USERS
  # ---------------------------------------------------------------------------------
  /users/me:
    get:
      tags: [Users]
      summary: Get the authenticated user's profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeUser'
    patch:
      tags: [Users]
      summary: Update the authenticated user's profile/preferences
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                avatarUrl: { type: string, nullable: true }
                denominationLens: { type: string, nullable: true }
                locale: { type: string }
                timezone: { type: string }
                defaultBibleVersionId: { type: string, nullable: true }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeUser'
    delete:
      tags: [Users]
      summary: Soft-delete the authenticated user's account (14-day recoverable, §12 §5)
      responses:
        "202":
          description: Account scheduled for deletion

  /users/me/sessions:
    get:
      tags: [Users]
      summary: List active sessions (non-revoked refresh tokens)
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RefreshTokenSummary'

  /users/me/sessions/{id}:
    delete:
      tags: [Users]
      summary: Revoke a single session ("log out this device")
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        "204":
          description: Session revoked

  /users/me/export:
    post:
      tags: [Users]
      summary: Request a "Download My Data" export (async job, §12 §5)
      responses:
        "202":
          description: Export job queued; a signed S3 download link will be emailed (24h expiry)

  # ---------------------------------------------------------------------------------
  # ORGANIZATIONS
  # ---------------------------------------------------------------------------------
  /organizations:
    get:
      tags: [Organizations]
      summary: List organizations the authenticated user belongs to
      responses:
        "200":
          description: Organization memberships
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Organization'
    post:
      tags: [Organizations]
      summary: Create a new Ministry organization (initiates MINISTRY subscription setup)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                type: { type: string, example: "CHURCH" }
                billingEmail: { type: string, format: email, nullable: true }
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeOrganization'

  /organizations/{id}:
    get:
      tags: [Organizations]
      summary: Get organization detail
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeOrganization'
        "404":
          $ref: '#/components/responses/NotFound'
        "403":
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Organizations]
      summary: Update organization (name, seatLimit, billingEmail) — ADMIN role in org
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                seatLimit: { type: integer }
                billingEmail: { type: string, format: email, nullable: true }
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeOrganization'

  /organizations/{id}/members:
    get:
      tags: [Organizations]
      summary: List organization members
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrganizationMember'
                  meta:
                    $ref: '#/components/schemas/OffsetPaginationMeta'
    post:
      tags: [Organizations]
      summary: Invite/add a member to the organization
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, roleInOrg]
              properties:
                email: { type: string, format: email }
                roleInOrg: { type: string, enum: [ADMIN, STAFF] }
      responses:
        "201":
          description: Member added/invited
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OrganizationMember'

  # ---------------------------------------------------------------------------------
  # SUBSCRIPTIONS
  # ---------------------------------------------------------------------------------
  /subscriptions/me:
    get:
      tags: [Subscriptions]
      summary: Get the authenticated user's (or org's) subscription, tier, and entitlements
      responses:
        "200":
          description: Subscription + resolved entitlements
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Subscription'
                      - type: object
                        properties:
                          entitlements:
                            $ref: '#/components/schemas/Entitlements'

  /subscriptions/checkout:
    post:
      tags: [Subscriptions]
      summary: Create a Stripe Checkout session (web) for a tier/billing-cycle change
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [tier, billingCycle]
              properties:
                tier:
                  $ref: '#/components/schemas/SubscriptionTier'
                billingCycle: { type: string, enum: [MONTHLY, ANNUAL] }
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      checkoutUrl: { type: string, format: uri }

  /subscriptions/invoices:
    get:
      tags: [Subscriptions]
      summary: List billing history for the authenticated user/org
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        "200":
          description: Invoices
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invoice'
                  meta:
                    $ref: '#/components/schemas/OffsetPaginationMeta'

  /subscriptions/webhooks/{provider}:
    post:
      tags: [Subscriptions]
      summary: Inbound billing webhook (signature-verified, not bearerAuth)
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [stripe, apple, google]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Provider-specific payload (Stripe event, Apple Server Notification V2, or Google RTDN)
      responses:
        "200":
          description: Acknowledged

  # ---------------------------------------------------------------------------------
  # BIBLE
  # ---------------------------------------------------------------------------------
  /bible/versions:
    get:
      tags: [Bible]
      summary: List available Bible versions
      security: []
      responses:
        "200":
          description: Bible versions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BibleVersion'

  /bible/books:
    get:
      tags: [Bible]
      summary: List the 66 canonical Bible books
      security: []
      responses:
        "200":
          description: Bible books
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BibleBook'

  /bible/books/{bookId}/chapters/{chapter}:
    get:
      tags: [Bible]
      summary: Get all verses for a chapter in a given version
      security: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: string }
        - name: chapter
          in: path
          required: true
          schema: { type: integer }
        - name: version
          in: query
          required: false
          schema: { type: string, default: "KJV", example: "ESV" }
      responses:
        "200":
          description: Verses with text for the requested version
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VerseWithText'
        "404":
          $ref: '#/components/responses/NotFound'

  /bible/search:
    get:
      tags: [Bible]
      summary: Full-text search across Bible text (by version)
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: version
          in: query
          required: false
          schema: { type: string, default: "KJV" }
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        "200":
          description: Matching verses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VerseWithText'
                  meta:
                    $ref: '#/components/schemas/CursorPaginationMeta'

  # ---------------------------------------------------------------------------------
  # BIBLE INTERACTIONS (Highlights / Notes / Bookmarks)
  # ---------------------------------------------------------------------------------
  /highlights:
    get:
      tags: [Bible Interactions]
      summary: List the authenticated user's highlights
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        "200":
          description: Highlights
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Highlight'
                  meta:
                    $ref: '#/components/schemas/CursorPaginationMeta'
    post:
      tags: [Bible Interactions]
      summary: Highlight a verse
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [verseId]
              properties:
                verseId: { type: string }
                color: { type: string, default: "yellow" }
      responses:
        "201":
          description: Highlight created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Highlight'

  /highlights/{id}:
    delete:
      tags: [Bible Interactions]
      summary: Remove a highlight
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        "204":
          description: Removed

  /notes:
    get:
      tags: [Bible Interactions]
      summary: List the authenticated user's verse notes
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Note'
                  meta:
                    $ref: '#/components/schemas/CursorPaginationMeta'
    post:
      tags: [Bible Interactions]
      summary: Create a note on a verse
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [verseId, content]
              properties:
                verseId: { type: string }
                content: { type: string }
      responses:
        "201":
          description: Note created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Note'

  /notes/{id}:
    patch:
      tags: [Bible Interactions]
      summary: Update a note
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Note'
    delete:
      tags: [Bible Interactions]
      summary: Delete a note
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        "204":
          description: Deleted

  /bookmarks:
    get:
      tags: [Bible Interactions]
      summary: List the authenticated user's bookmarks
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        "200":
          description: Bookmarks
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Bookmark'
                  meta:
                    $ref: '#/components/schemas/CursorPaginationMeta'
    post:
      tags: [Bible Interactions]
      summary: Bookmark a verse
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [verseId]
              properties:
                verseId: { type: string }
      responses:
        "201":
          description: Bookmark created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Bookmark'

  /bookmarks/{id}:
    delete:
      tags: [Bible Interactions]
      summary: Remove a bookmark
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        "204":
          description: Removed

  # ---------------------------------------------------------------------------------
  # READING PLANS
  # ---------------------------------------------------------------------------------
  /reading-plans:
    get:
      tags: [Reading Plans]
      summary: List the reading plan library
      parameters:
        - name: category
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        "200":
          description: Reading plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReadingPlan'
                  meta:
                    $ref: '#/components/schemas/OffsetPaginationMeta'

  /reading-plans/{id}:
    get:
      tags: [Reading Plans]
      summary: Get a reading plan with its day-by-day passages
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        "200":
          description: Reading plan detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ReadingPlanDetail'
        "404":
          $ref: '#/components/responses/NotFound'

  /reading-plans/{id}/enroll:
    post:
      tags: [Reading Plans]
      summary: Enroll the authenticated user in a reading plan
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        "201":
          description: Enrolled
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserReadingPlan'
        "409":
          description: Already enrolled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /reading-plans/my:
    get:
      tags: [Reading Plans]
      summary: List the authenticated user's active/completed plans
      responses:
        "200":
          description: User reading plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserReadingPlan'

  # ---------------------------------------------------------------------------------
  # SCRIPTURE ANALYSIS ENGINE
  # ---------------------------------------------------------------------------------
  /scripture-analysis:
    post:
      tags: [Scripture Analysis]
      summary: Run (or retrieve cached) Scripture Analysis for a passage
      description: >
        Returns detected Themes and Biblical Elements, plus Theme Discovery suggestions, for a
        passage (§06 AI Architecture). Backed by ScriptureAnalysisCache — meta.cacheHit indicates
        whether the AI Gateway was invoked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passageKey]
              properties:
                passageKey: { type: string, example: "ROM.8.28-39" }
                versionCode: { type: string, default: "ESV" }
      responses:
        "200":
          description: Scripture analysis result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ScriptureAnalysisResult'
                  meta:
                    type: object
                    properties:
                      cacheHit: { type: boolean }

  # ---------------------------------------------------------------------------------
  # DEVOTIONS (AI Verse-to-Devotion Engine™)
  # ---------------------------------------------------------------------------------
  /devotions:
    get:
      tags: [Devotions]
      summary: List "My Devotions"
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DevotionType'
      responses:
        "200":
          description: Devotions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Devotion'
                  meta:
                    $ref: '#/components/schemas/CursorPaginationMeta'

  /devotions/generate:
    post:
      tags: [Devotions]
      summary: Generate a devotion via the AI Verse-to-Devotion Engine™ (streamable)
      description: >
        Clients sending `Accept: text/event-stream` receive a Server-Sent Events stream with one
        `event: section` per canonical section (§00 §8), followed by `event: done` carrying the
        persisted devotionId. Clients sending `Accept: application/json` receive the full Devotion
        object once generation completes. See §09 §6 for the full SSE protocol.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateDevotionRequest'
      responses:
